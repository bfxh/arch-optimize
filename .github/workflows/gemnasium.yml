name: Gemnasium Dependency Scan

on:
  push:
    branches: [main, master, main-v2, develop]
  pull_request:
    branches: [main, master, main-v2, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  gemnasium:
    name: Gemnasium Dependency Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run Gemnasium Dependency Scanning
        uses: gitlab/gemnasium-db-git-action@master
        with:
          gemnasium-token: ${{ secrets.GEMNASIUM_TOKEN }}
          project-path: .
