name: Pulumi Policy Scan

on:
  push:
    branches: [main, master, main-v2, develop]
  pull_request:
    branches: [main, master, main-v2, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  pulumi:
    name: Pulumi Policy Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Pulumi
        uses: pulumi/actions@v5
        with:
          pulumi-version: latest
      - name: Run Pulumi Policy Pack
        run: |
          if [ -d "policy-pack" ]; then
            pulumi policy validate policy-pack/ || true
          else
            echo "::warning::No policy-pack directory found"
          fi
