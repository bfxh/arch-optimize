name: Kubernetes Hunter (kube-hunter)

on:
  push:
    branches: [main, master, main-v2, develop]
  pull_request:
    branches: [main, master, main-v2, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  kube-hunter:
    name: kube-hunter Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run kube-hunter
        run: |
          docker run --rm \
            -v "$(pwd)/kube-hunter-output:/output" \
            aquasec/kube-hunter:latest \
            --hunter --report json > /output/kube-hunter-results.json || true
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kube-hunter-results
          path: kube-hunter-output/
