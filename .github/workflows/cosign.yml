name: Cosign Container Signing

on:
  push:
    branches: [main, master, main-v2, develop]
  pull_request:
    branches: [main, master, main-v2, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  cosign:
    name: Cosign Container Signing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      - name: Log in to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Sign image with Cosign (keyless)
        run: |
          IMAGE="${{ secrets.DOCKER_IMAGE || 'ghcr.io/'${{ github.repository }}:latest' }}"
          cosign sign --yes "$IMAGE" || echo "::warning::No image to sign"
      - name: Verify image signature
        run: |
          IMAGE="${{ secrets.DOCKER_IMAGE || 'ghcr.io/'${{ github.repository }}:latest' }}"
          cosign verify "$IMAGE" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/cosign.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" || true
