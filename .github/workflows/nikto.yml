name: Nikto Web Scanner

on:
  push:
    branches: [main, master, main-v2, develop]
  pull_request:
    branches: [main, master, main-v2, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  nikto:
    name: Nikto Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run Nikto
        run: |
          docker run --rm \
            -v "$(pwd):/results" \
            frapsoft/nikto \
            -h ${{ secrets.NIKTO_TARGET || 'http://localhost:8080' }} \
            -Format json \
            -output /results/nikto-results.json || true
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nikto-results
          path: nikto-results.json
