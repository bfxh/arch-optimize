name: TruffleHog3

on:
  push:
    branches: [main, master, main-v2, develop]
  pull_request:
    branches: [main, master, main-v2, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  trufflehog3:
    name: TruffleHog3 Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install TruffleHog3
        run: pip install trufflehog3
      - name: Run TruffleHog3
        run: trufflehog3 --format json --output trufflehog3-results.json . || true
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trufflehog3-results
          path: trufflehog3-results.json
