name: Clair Container Scan

on:
  push:
    branches: [main, master, main-v2, develop]
  pull_request:
    branches: [main, master, main-v2, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  clair:
    name: Clair Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run Clair Scanner
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v $PWD:/results \
            arminc/clair-scanner:latest \
            --ip $(hostname -I | awk '{print $1}') \
            -t HIGH \
            --report /results/clair-report.json \
            ${{ secrets.DOCKER_IMAGE || 'alpine:latest' }} || true
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clair-results
          path: clair-report.json
