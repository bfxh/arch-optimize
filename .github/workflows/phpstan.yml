name: PHPStan Static Analysis

on:
  push:
    branches: [main, master, main-v2, develop]
  pull_request:
    branches: [main, master, main-v2, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  phpstan:
    name: PHPStan Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Install PHPStan
        run: composer require --dev phpstan/phpstan || true
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse . --level=8 --no-progress --error-format=raw
