name: Kubesec Kubernetes Security Analysis

on:
  push:
    branches: [main, master, main-v2, develop]
  pull_request:
    branches: [main, master, main-v2, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  kubesec:
    name: Kubesec Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run Kubesec
        uses: controlplaneio/kubesec-action@v0.0.2
        with:
          file: k8s/
          format: json
          output: kubesec-results.json
