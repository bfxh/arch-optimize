name: SLSA Supply Chain Verification

on:
  push:
    branches: [main, master, main-v2, develop]
  pull_request:
    branches: [main, master, main-v2, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  slsa:
    name: SLSA Provenance Generation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Generate SLSA provenance
        uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2
        with:
          base64-subjects: ""
          upload-assets: true
      - name: Verify SLSA provenance
        run: |
          if [ -f "slsa-provenance.intoto.jsonl" ]; then
            echo "SLSA provenance file found"
            cat slsa-provenance.intoto.jsonl
          else
            echo "::warning::No SLSA provenance file found"
          fi
