name: Detekt Kotlin Static Analysis

on:
  push:
    branches: [main, master, main-v2, develop]
  pull_request:
    branches: [main, master, main-v2, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  detekt:
    name: Detekt Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run Detekt
        run: |
          if [ -f "build.gradle.kts" ] || [ -f "build.gradle" ]; then
            ./gradlew detekt || true
          else
            echo "No Gradle build file found, downloading detekt CLI"
            curl -sSLO https://github.com/detekt/detekt/releases/latest/download/detekt-cli.zip
            unzip -q detekt-cli.zip
            ./detekt-cli/bin/detekt-cli -i . || true
          fi
