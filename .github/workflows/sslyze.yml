name: SSLyze Scan

on:
  push:
    branches: [main, master, main-v2, develop]
  pull_request:
    branches: [main, master, main-v2, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  sslyze:
    name: SSLyze Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install SSLyze
        run: pip install sslyze
      - name: Run SSLyze
        run: sslyze --json_out=sslyze-results.json ${{ secrets.SSL_TARGET || 'localhost' }} || true
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sslyze-results
          path: sslyze-results.json
