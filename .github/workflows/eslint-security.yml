name: ESLint Security Plugin

on:
  push:
    branches: [main, master, main-v2, develop]
  pull_request:
    branches: [main, master, main-v2, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  eslint-security:
    name: ESLint Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Install eslint-plugin-security
        run: npm install --save-dev eslint eslint-plugin-security
      - name: Run ESLint Security
        run: npx eslint . --ext .js,.jsx,.ts,.tsx --format json --output-file eslint-security.json || true
      - name: Upload ESLint results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eslint-security-results
          path: eslint-security.json
