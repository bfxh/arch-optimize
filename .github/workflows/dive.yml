name: Dive Image Analysis

on:
  push:
    branches: [main, master, main-v2, develop]
  pull_request:
    branches: [main, master, main-v2, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  dive:
    name: Dive Image Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Dive
        run: |
          wget https://github.com/wagoodman/dive/releases/latest/download/dive_linux_amd64.tar.gz
          tar -xzf dive_linux_amd64.tar.gz
          chmod +x dive
      - name: Run Dive
        run: ./dive ${{ secrets.DOCKER_IMAGE || 'alpine:latest' }} --ci || true
