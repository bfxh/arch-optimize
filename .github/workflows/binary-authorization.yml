name: Binary Authorization

on:
  push:
    branches: [main, master, main-v2, develop]
  pull_request:
    branches: [main, master, main-v2, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  binary-authorization:
    name: Binary Authorization Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Verify Binary Authorization
        run: |
          IMAGE="${{ secrets.DOCKER_IMAGE || 'gcr.io/'${{ secrets.GCP_PROJECT }}'/app:latest' }}"
          gcloud container images describe "$IMAGE" \
            --format="value(image_analysis_status)" \
            --project=${{ secrets.GCP_PROJECT }} || true
          gcloud beta container binauthz attestations list \
            --project=${{ secrets.GCP_PROJECT }} || true
