---
# Python Bandit 安全扫描 - 检测 Python 代码中的常见安全问题
name: "Python Bandit Security Scan"

on:
  push:
    branches: [main, master, develop]
    paths:
      - '**.py'
  pull_request:
    branches: [main, master, develop]
    paths:
      - '**.py'
  schedule:
    - cron: '0 4 * * 2'

permissions:
  contents: read
  security-events: write

jobs:
  bandit:
    name: Bandit Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install bandit
        run: pip install bandit bandit-sarif-formatter

      - name: Run Bandit scan
        run: bandit -r . -f sarif -o bandit-results.sarif --exclude './.git,./node_modules,./venv,./.venv,./build,./dist'
        continue-on-error: true

      - name: Upload Bandit results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: bandit-results.sarif

      - name: Upload Bandit artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandit-results
          path: bandit-results.sarif
