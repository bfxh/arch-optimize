---
# Ruff Python 检查 - 使用 Ruff 进行极速 Python 代码检查
name: "Ruff Python Lint"

on:
  push:
    branches: [main, master, develop]
    paths:
      - '**.py'
      - '**/pyproject.toml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - '**.py'
      - '**/pyproject.toml'
  workflow_dispatch:  # 分支推送本身不触发这些门（受 branches/paths 限制），需要时手动跑

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: pip install "ruff==0.16.8"  # 钉版本：否则 ruff 升级会悄悄扩大默认规则集，门忽红或忽绿

      - name: Run Ruff check (blocking)
        # 规则集在 pyproject [tool.ruff.lint] 显式声明；被 ignore 的 4 类带着理由，不是"整体跳过检查"
        run: ruff check .

      - name: Run Ruff format check (informational)
        # 仓内 6 个文件尚未按 ruff format 排版；等一次纯排版提交后再摘掉本行为
        run: ruff format . --check
        continue-on-error: true

      - name: Run Ruff with all rules (report only)
        run: ruff check . --select ALL --output-format=json > ruff-report.json || true
        continue-on-error: true

      - name: Upload Ruff report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ruff-report
          path: ruff-report.json
