---
# Ruff Python 检查 - 使用 Ruff 进行极速 Python 代码检查
name: "Ruff Python Lint"

on:
  push:
    branches: [main, master, develop]
    paths:
      - '**.py'
      - '**/pyproject.toml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - '**.py'
      - '**/pyproject.toml'
  workflow_dispatch:  # 分支推送本身不触发这些门（受 branches/paths 限制），需要时手动跑

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: pip install "ruff==0.16.8"  # 钉版本：否则 ruff 升级会悄悄扩大默认规则集，门忽红或忽绿

      - name: Run Ruff check (blocking)
        # 规则集在 pyproject [tool.ruff.lint] 显式声明；被 ignore 的 4 类带着理由，不是"整体跳过检查"
        run: ruff check .

      - name: Run Ruff format check (blocking)
        # 纯排版已入库（见 style(format) 提交），此步开始判红
        run: ruff format . --check

      - name: Run Ruff with all rules (report only)
        run: ruff check . --select ALL --output-format=json > ruff-report.json || true
        continue-on-error: true

      - name: Upload Ruff report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ruff-report
          path: ruff-report.json
