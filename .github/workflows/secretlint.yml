name: SecretLint

on:
  push:
    branches: [main, master, main-v2, develop]
  pull_request:
    branches: [main, master, main-v2, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  secretlint:
    name: SecretLint Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install SecretLint
        run: npm install -g secretlint @secretlint/secretlint-rule-preset-recommend
      - name: Run SecretLint
        run: secretlint "**/*" --format json --output secretlint-results.json || true
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secretlint-results
          path: secretlint-results.json
