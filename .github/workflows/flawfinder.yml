name: Flawfinder C/C++ Vulnerability Scan

on:
  push:
    branches: [main, master, main-v2, develop]
  pull_request:
    branches: [main, master, main-v2, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  flawfinder:
    name: Flawfinder Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Flawfinder
        run: sudo apt-get update && sudo apt-get install -y flawfinder
      - name: Run Flawfinder
        run: flawfinder --sarif . > flawfinder.sarif || true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: flawfinder.sarif
