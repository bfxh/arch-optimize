---
# Dockerfile 安全检查 - 检查 Dockerfile 的安全最佳实践
name: "Dockerfile Lint"

on:
  push:
    paths:
      - '**/Dockerfile'
      - '**/Dockerfile.*'
      - '**/*.dockerfile'
  pull_request:
    paths:
      - '**/Dockerfile'
      - '**/Dockerfile.*'
      - '**/*.dockerfile'

permissions:
  contents: read

jobs:
  dockerfile-lint:
    name: Dockerfile Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile
          recursive: true
          format: sarif
          output-file: hadolint-results.sarif
        continue-on-error: true

      - name: Upload hadolint results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: hadolint-results.sarif

      - name: Run dockerfile security scan with trivy
        uses: aquasecurity/trivy-action@master
        if: hashFiles('Dockerfile') != ''
        with:
          scan-type: config
          scan-ref: Dockerfile
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'
        continue-on-error: true
