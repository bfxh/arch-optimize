name: Conftest Policy Test

on:
  push:
    branches: [main, master, main-v2, develop]
  pull_request:
    branches: [main, master, main-v2, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  conftest:
    name: Conftest Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Conftest
        run: |
          wget https://github.com/open-policy-agent/conftest/releases/latest/download/conftest-linux-amd64.tar.gz
          tar -xzf conftest-linux-amd64.tar.gz
          chmod +x conftest
      - name: Run Conftest
        run: ./conftest test . --output json --output-file conftest-results.json || true
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conftest-results
          path: conftest-results.json
