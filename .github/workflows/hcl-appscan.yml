name: HCL AppScan Static Analysis

on:
  push:
    branches: [main, master, main-v2, develop]
  pull_request:
    branches: [main, master, main-v2, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  appscan:
    name: HCL AppScan Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run HCL AppScan CodeSweep
        uses: hcl/appscan-codesweep-action@v2
        with:
          appscan_key: ${{ secrets.APPSCAN_KEY }}
          appscan_secret: ${{ secrets.APPSCAN_SECRET }}
          application_id: ${{ secrets.APPSCAN_APPLICATION_ID }}
