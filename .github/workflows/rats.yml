name: RATS Rough Auditing Tool for Security

on:
  push:
    branches: [main, master, main-v2, develop]
  pull_request:
    branches: [main, master, main-v2, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  rats:
    name: RATS Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install RATS
        run: sudo apt-get update && sudo apt-get install -y rats
      - name: Run RATS
        run: rats -w 3 -A . || true
