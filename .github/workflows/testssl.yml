name: TestSSL

on:
  push:
    branches: [main, master, main-v2, develop]
  pull_request:
    branches: [main, master, main-v2, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  testssl:
    name: TestSSL Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run TestSSL
        run: |
          docker run --rm drwetter/testssl.sh:latest \
            --json-pretty \
            ${{ secrets.SSL_TARGET || 'localhost' }} > testssl-results.json || true
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testssl-results
          path: testssl-results.json
