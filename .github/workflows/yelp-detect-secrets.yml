name: Yelp Detect Secrets (Advanced)

on:
  push:
    branches: [main, master, main-v2, develop]
  pull_request:
    branches: [main, master, main-v2, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  yelp-detect-secrets:
    name: Yelp Detect Secrets Advanced
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install detect-secrets
        run: pip install detect-secrets
      - name: Generate baseline
        run: detect-secrets scan --all-files --force-use-all-plugins . > .secrets.baseline
      - name: Audit baseline
        run: detect-secrets audit --report .secrets.baseline > detect-secrets-advanced.json || true
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detect-secrets-advanced-results
          path: |
            .secrets.baseline
            detect-secrets-advanced.json
