name: CredSweeper

on:
  push:
    branches: [main, master, main-v2, develop]
  pull_request:
    branches: [main, master, main-v2, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  credsweeper:
    name: CredSweeper Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install CredSweeper
        run: pip install credsweeper
      - name: Run CredSweeper
        run: credsweeper --path . --save-json credsweeper-results.json --log credsweeper.log || true
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: credsweeper-results
          path: |
            credsweeper-results.json
            credsweeper.log
