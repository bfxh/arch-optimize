name: Whisper Credential Scan

on:
  push:
    branches: [main, master, main-v2, develop]
  pull_request:
    branches: [main, master, main-v2, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  whisper:
    name: Whisper Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Whisper
        run: |
          pip install whisper-secrets
      - name: Run Whisper
        run: whisper --path . --output-format json --output-file whisper-results.json || true
      - name: Upload Whisper results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whisper-results
          path: whisper-results.json
