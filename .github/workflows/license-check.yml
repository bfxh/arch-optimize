name: License Check

on:
  push:
    branches: [main, master, main-v2, develop]
  pull_request:
    branches: [main, master, main-v2, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  license-check:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run License Checker
        uses: hiwelo/license-checker-action@v1.2.0
        with:
          allowed-licenses: MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,0BSD
          output: license-check-results.txt
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: license-check-results
          path: license-check-results.txt
