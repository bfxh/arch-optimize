---
# MyPy 类型检查 - Python 静态类型检查
name: "MyPy Type Check"

on:
  push:
    branches: [main, master, develop]
    paths:
      - '**.py'
      - '**/pyproject.toml'
      - '**/setup.cfg'
  pull_request:
    branches: [main, master, develop]
    paths:
      - '**.py'
      - '**/pyproject.toml'
      - '**/setup.cfg'
  workflow_dispatch:  # 分支推送本身不触发这些门（受 branches/paths 限制），需要时手动跑

permissions:
  contents: read

jobs:
  mypy:
    name: MyPy Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install MyPy
        run: pip install "mypy==2.3.1"  # 钉版本：规则面随版本变化，否则门的判定会无因漂移

      # 原先这里有一步"装类型 stub / 装 requirements.txt / pip install -e ."，三行全带 `|| true`。
      # 实测它是装饰性的：本仓 7 个源文件只用标准库（grep 无一例外），requirements.txt 不存在
      # 所以那条分支永不执行，而 mypy 用 --ignore-missing-imports 跑源码，装不装 -e 都不改判定。
      # 吞错步骤留着只会让人以为"依赖装好了才判绿"。tests.yml 的 pytest 任务负责真的装。

      - name: Run MyPy (blocking)
        # 非 strict 档已清零（20 -> 0），这一步判红即为真回归
        run: mypy . --ignore-missing-imports --show-error-codes

      - name: Run MyPy with strict mode (report only)
        run: mypy . --strict --ignore-missing-imports --output json > mypy-report.json || true
        continue-on-error: true

      - name: Upload MyPy report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mypy-report
          path: mypy-report.json
