---
# MyPy 类型检查 - Python 静态类型检查
name: "MyPy Type Check"

on:
  push:
    branches: [main, master, develop]
    paths:
      - '**.py'
      - '**/pyproject.toml'
      - '**/setup.cfg'
  pull_request:
    branches: [main, master, develop]
    paths:
      - '**.py'
      - '**/pyproject.toml'
      - '**/setup.cfg'
  workflow_dispatch:  # 分支推送本身不触发这些门（受 branches/paths 限制），需要时手动跑

permissions:
  contents: read

jobs:
  mypy:
    name: MyPy Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install MyPy
        run: pip install "mypy==2.3.1"  # 钉版本：规则面随版本变化，否则门的判定会无因漂移

      - name: Install type stubs
        run: |
          pip install types-requests types-PyYAML types-setuptools || true
          # 安装项目依赖
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt || true
          fi
          if [ -f "pyproject.toml" ]; then
            pip install -e . || true
          fi

      - name: Run MyPy (blocking)
        # 非 strict 档已清零（20 -> 0），这一步判红即为真回归
        run: mypy . --ignore-missing-imports --show-error-codes

      - name: Run MyPy with strict mode (report only)
        run: mypy . --strict --ignore-missing-imports --output json > mypy-report.json || true
        continue-on-error: true

      - name: Upload MyPy report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mypy-report
          path: mypy-report.json
