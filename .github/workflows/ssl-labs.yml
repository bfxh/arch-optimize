name: SSL Labs Assessment

on:
  push:
    branches: [main, master, main-v2, develop]
  pull_request:
    branches: [main, master, main-v2, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  ssl-labs:
    name: SSL Labs Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install SSL Labs API
        run: npm install -g ssllabs
      - name: Run SSL Labs Assessment
        run: |
          ssllabs scan --host ${{ secrets.SSL_TARGET || 'localhost' }} --format json > ssl-labs-results.json || true
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssl-labs-results
          path: ssl-labs-results.json
