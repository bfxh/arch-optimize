name: Git Leaks Scan

on:
  push:
    branches: [main, master, main-v2, develop]
  pull_request:
    branches: [main, master, main-v2, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  git-leaks:
    name: Git Leaks Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks CLI
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks-linux-amd64 -o gitleaks
          chmod +x gitleaks
      - name: Run Gitleaks (repo scan)
        run: ./gitleaks detect --source . --report-format json --report-path git-leaks-results.json --no-banner || true
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: git-leaks-results
          path: git-leaks-results.json
