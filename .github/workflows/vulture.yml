---
# Vulture 死代码检测 - 检测 Python 项目中的无用代码
name: "Vulture Dead Code Detection"

on:
  push:
    branches: [main, master, develop]
    paths:
      - '**.py'
  pull_request:
    branches: [main, master, develop]
    paths:
      - '**.py'
  schedule:
    - cron: '0 7 * * 2'

permissions:
  contents: read

jobs:
  vulture:
    name: Vulture Dead Code Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Vulture
        run: pip install vulture

      - name: Install project dependencies
        run: |
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt || true
          fi

      - name: Run Vulture
        run: vulture . --min-confidence 80 --format json > vulture-report.json || true
        continue-on-error: true

      - name: Run Vulture with verbose output
        run: vulture . --min-confidence 60
        continue-on-error: true

      - name: Display Vulture results
        run: cat vulture-report.json || echo "No dead code found"

      - name: Upload Vulture report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vulture-report
          path: vulture-report.json
