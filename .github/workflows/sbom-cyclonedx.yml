---
# CycloneDX SBOM 生成 - 生成 CycloneDX 格式的软件物料清单
name: "CycloneDX SBOM Generation"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  cyclonedx:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate SBOM with cyclonedx
        uses: CycloneDX/gh-action-generate-bom@v4
        with:
          output: bom.cyclonedx.json
          format: json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: bom.cyclonedx.json

      - name: Submit SBOM to GitHub
        uses: advanced-security/spdx-dependency-submission-action@v0.1.1
        if: github.event_name == 'push'
        continue-on-error: true
        with:
          filePath: bom.cyclonedx.json
