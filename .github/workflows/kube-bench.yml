name: Kubernetes CIS Benchmark (kube-bench)

on:
  push:
    branches: [main, master, main-v2, develop]
  pull_request:
    branches: [main, master, main-v2, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  kube-bench:
    name: kube-bench Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run kube-bench
        run: |
          docker run --rm \
            -v "$(pwd)/kube-bench-output:/output" \
            aquasec/kube-bench:latest \
            --json --output-file /results/kube-bench-results.json || true
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kube-bench-results
          path: kube-bench-output/
