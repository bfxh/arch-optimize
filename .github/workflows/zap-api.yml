name: OWASP ZAP API Scan

on:
  push:
    branches: [main, master, main-v2, develop]
  pull_request:
    branches: [main, master, main-v2, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  zap-api:
    name: ZAP API Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: ZAP API Scan
        uses: zaproxy/action-api@v0.13.0
        with:
          target: ${{ secrets.ZAP_API_TARGET || 'http://localhost:8080' }}
          format: openapi
          cmd_options: '-a'
          output_format: sarif
          output_file: zap-api.sarif
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: zap-api.sarif
