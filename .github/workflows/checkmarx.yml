name: Checkmarx SAST

on:
  push:
    branches: [main, master, main-v2, develop]
  pull_request:
    branches: [main, master, main-v2, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  checkmarx:
    name: Checkmarx SAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Checkmarx SAST Scan
        uses: checkmarx-ts/checkmarx-cxflow-github-action@master
        with:
          team: ${{ secrets.CX_TEAM }}
          checkmarx_url: ${{ secrets.CX_URL }}
          checkmarx_username: ${{ secrets.CX_USER }}
          checkmarx_password: ${{ secrets.CX_PASSWORD }}
          checkmarx_client_secret: ${{ secrets.CX_CLIENT_SECRET }}
          project: ${{ github.event.repository.name }}
          preset: "Checkmarx Default"
          incremental: false
