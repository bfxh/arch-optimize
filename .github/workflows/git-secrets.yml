---
# AWS Git Secrets 检测 - 检测代码中可能泄露的 AWS 凭证
name: "Git Secrets Detection"

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: '0 15 * * 1'

permissions:
  contents: read

jobs:
  git-secrets:
    name: Git Secrets Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-secrets
        run: |
          sudo apt-get update
          sudo apt-get install -y git-secrets
          git secrets --register-aws

      - name: Scan repository
        run: |
          echo "=== Scanning current files ==="
          git secrets --scan -r . || true

          echo "=== Scanning git history ==="
          git secrets --scan-history || true

      - name: Generate report
        run: |
          git secrets --scan -r . > git-secrets-report.txt 2>&1 || true
          cat git-secrets-report.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: git-secrets-report
          path: git-secrets-report.txt
