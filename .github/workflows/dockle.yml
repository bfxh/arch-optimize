name: Dockle Container Scan

on:
  push:
    branches: [main, master, main-v2, develop]
  pull_request:
    branches: [main, master, main-v2, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  dockle:
    name: Dockle Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run Dockle
        uses: goodwithtech/dockle-action@main
        with:
          image: ${{ secrets.DOCKER_IMAGE || 'alpine:latest' }}
          format: json
          output: dockle-results.json
          exit-code: '0'
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dockle-results
          path: dockle-results.json
