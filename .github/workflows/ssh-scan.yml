name: SSH Scan

on:
  push:
    branches: [main, master, main-v2, develop]
  pull_request:
    branches: [main, master, main-v2, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  ssh-scan:
    name: SSH Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run SSH Scan
        uses: mozzb/ssh-scan-action@v1
        with:
          target: ${{ secrets.SSH_TARGET || 'localhost:22' }}
          output: json
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssh-scan-results
          path: ssh-scan-results.json
